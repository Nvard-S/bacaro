<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cicchetti Venice — find your bacaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16191A;
    --muted: #6B7270;
    --line: #E7E6E2;
    --bg: #FAFAF8;
    --card: #FFFFFF;
    --teal: #0E6E66;
    --teal-dark: #0A544E;
    --coral: #FF6B4A;
    --coral-dark: #E85332;
    --chip-bg: #F1F1EE;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 0;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px 80px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0; border-bottom: 1px solid var(--line); margin-bottom: 36px;
  }
  .brand { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; }
  .brand span { color: var(--coral); }

  .hero { padding: 20px 0 36px; }
  .hero h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; line-height: 1.15; }
  .hero p { color: var(--muted); font-size: 1.05rem; margin: 0; max-width: 560px; }

  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 22px; margin-bottom: 32px;
  }
  .search-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .search-row input[type=text] {
    flex: 1; min-width: 220px; padding: 13px 16px; border: 1.5px solid var(--line);
    border-radius: 12px; font-size: 1rem; font-family: inherit; background: #fff; color: var(--ink);
  }
  .search-row input[type=text]:focus { outline: none; border-color: var(--teal); }
  select {
    padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px;
    font-size: 0.95rem; font-family: inherit; background: #fff; color: var(--ink);
  }
  button {
    border: none; border-radius: 12px; padding: 13px 22px; font-family: inherit;
    font-weight: 700; font-size: 0.95rem; cursor: pointer; color: #fff;
    background: var(--coral); transition: background .15s ease, transform .1s ease;
  }
  button:hover { background: var(--coral-dark); }
  button:active { transform: translateY(1px); }

  .tags-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; margin: 4px 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--chip-bg); border: 1.5px solid transparent; color: var(--ink);
    padding: 8px 14px; border-radius: 999px; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; user-select: none; transition: all .12s ease;
  }
  .chip:hover { border-color: var(--line); }
  .chip.active { background: var(--teal); color: #fff; }

  .legend { font-size: 0.82rem; color: var(--muted); margin: -6px 0 18px; }

  .recap-line { font-size: 1.05rem; font-weight: 700; margin: 4px 0 4px; letter-spacing: -0.01em; }
  .status-line { font-size: 0.9rem; color: var(--muted); margin: 0 0 18px; }

  .answer-banner {
    background: linear-gradient(135deg, #FFF1EC, #E9F5F3);
    border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px;
    font-size: 1.05rem; font-weight: 600; margin-bottom: 20px;
  }
  .answer-banner .hl-name { color: var(--teal-dark); font-weight: 800; }
  .answer-banner .hl-query { text-decoration: underline; text-decoration-color: var(--coral); text-decoration-thickness: 2px; text-underline-offset: 3px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .bar-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; display: flex; flex-direction: column; gap: 8px;
  }
  .bar-card.unconfirmed { border-style: dashed; }
  .bar-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .bar-card .name { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
  .bar-card .rating {
    flex-shrink: 0; background: var(--chip-bg); border-radius: 999px; padding: 3px 10px;
    font-size: 0.85rem; font-weight: 700; white-space: nowrap;
  }
  .bar-card .rating .count { font-weight: 600; color: var(--muted); }
  .bar-card .meta { color: var(--muted); font-size: 0.88rem; }
  .bar-card .address { font-size: 0.9rem; }
  .bar-card .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.72rem;
    font-weight: 700; background: #F2E9DC; color: #8A6A2E;
  }
  .bar-card .explanation { font-size: 0.88rem; color: var(--ink); margin-top: 2px; }
  .bar-card .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .bar-card .card-tags span {
    background: var(--chip-bg); color: var(--muted); font-size: 0.74rem; font-weight: 600;
    padding: 3px 9px; border-radius: 999px;
  }
  .icon-links { display: flex; gap: 8px; margin-top: 4px; }
  .icon-link {
    width: 32px; height: 32px; border-radius: 50%; background: var(--chip-bg);
    display: flex; align-items: center; justify-content: center; color: var(--ink);
    transition: background .15s ease, color .15s ease; flex-shrink: 0;
  }
  .icon-link:hover { background: var(--teal); color: #fff; }
  .icon-link svg { width: 16px; height: 16px; }

  .empty-state { color: var(--muted); font-size: 0.95rem; padding: 24px 0; }

  .cicchetti-loader { display: none; justify-content: flex-start; padding: 20px 0 24px; }
  .cicchetti-loader.active { display: flex; }
  .loader-row { display: flex; gap: 8px; align-items: flex-end; }
  .loader-bite { width: 28px; height: 28px; opacity: 0; }
  .loader-bite svg { width: 100%; height: 100%; display: block; }
  .loader-bite:nth-child(1) { animation: bite-1 1.75s ease-in-out infinite; }
  .loader-bite:nth-child(2) { animation: bite-2 1.75s ease-in-out infinite; }
  .loader-bite:nth-child(3) { animation: bite-3 1.75s ease-in-out infinite; }
  .loader-bite:nth-child(4) { animation: bite-4 1.75s ease-in-out infinite; }
  .loader-bite:nth-child(5) { animation: bite-5 1.75s ease-in-out infinite; }
  /* Each icon switches on at its own point in one shared cycle (0%, then
     ~14% later per icon) and all switch off together near the end, so the
     row visibly builds 1 -> 5 left to right, then resets and repeats. */
  @keyframes bite-1 {
    0%, 88% { opacity: 1; transform: scale(1) translateY(0); }
    92%, 100% { opacity: 0; transform: scale(0.5) translateY(4px); }
  }
  @keyframes bite-2 {
    0%, 14% { opacity: 0; transform: scale(0.5) translateY(4px); }
    18%, 88% { opacity: 1; transform: scale(1) translateY(0); }
    92%, 100% { opacity: 0; transform: scale(0.5) translateY(4px); }
  }
  @keyframes bite-3 {
    0%, 28% { opacity: 0; transform: scale(0.5) translateY(4px); }
    32%, 88% { opacity: 1; transform: scale(1) translateY(0); }
    92%, 100% { opacity: 0; transform: scale(0.5) translateY(4px); }
  }
  @keyframes bite-4 {
    0%, 42% { opacity: 0; transform: scale(0.5) translateY(4px); }
    46%, 88% { opacity: 1; transform: scale(1) translateY(0); }
    92%, 100% { opacity: 0; transform: scale(0.5) translateY(4px); }
  }
  @keyframes bite-5 {
    0%, 56% { opacity: 0; transform: scale(0.5) translateY(4px); }
    60%, 88% { opacity: 1; transform: scale(1) translateY(0); }
    92%, 100% { opacity: 0; transform: scale(0.5) translateY(4px); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Cicchetti<span>Venice</span></div>
  </header>

  <div class="hero">
    <h1>Find your next bacaro</h1>
    <p>Real cicchetti bars across Venice, filtered your way — ask a question or just pick what you're after.</p>
  </div>

  <div class="panel">
    <div class="search-row">
      <input id="query" type="text" placeholder="">
      <select id="neighborhood">
        <option value="All Venice">All Venice</option>
        <option value="Cannaregio">Cannaregio</option>
        <option value="Castello">Castello</option>
        <option value="San Marco">San Marco</option>
        <option value="Dorsoduro">Dorsoduro</option>
        <option value="San Polo">San Polo</option>
        <option value="Santa Croce">Santa Croce</option>
      </select>
      <button onclick="runSearch()">Find bacari</button>
    </div>
    <div class="tags-label">Filter by tag</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="legend">★ = average rating on Google · the number in parentheses = how many Google reviews it's based on</div>
  <div class="recap-line" id="recap"></div>
  <div class="cicchetti-loader" id="loader">
    <div class="loader-row" id="loaderRow"></div>
  </div>
  <div class="status-line" id="status">Loading…</div>
  <div class="answer-banner" id="answer" style="display:none;"></div>
  <div class="grid" id="results"></div>
</div>

<script>
let selectedTags = new Set();
let tagLabelMap = {};

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}
function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

const ICON_MAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-7.5-7-12a7 7 0 0 1 14 0c0 4.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>';
const ICON_SITE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z"/></svg>';
const ICON_INSTAGRAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" stroke="none"/></svg>';

// Simplified crostino: bread base, cream swirl, coral topping, pick w/ loop.
const ICON_CROSTINO = `<svg viewBox="0 0 32 32">
  <path d="M6 21c0 4.5 4.7 6.5 10.5 6.5S27 25.5 27 21c0-1.6-1-2.7-2-3.3-4.3 1.6-12.6 1.6-17 0-1 .6-2 1.7-2 3.3z" fill="#16191A"/>
  <path d="M6.5 18c2.2-3.2 6.3-3.2 9.5-1.6s7.5-1.6 9.5 1c-3.2 2.1-6.4 2.6-9.5 2.1-3.1.5-7.3-.1-9.5-1.5z" fill="#FFFFFF" stroke="#16191A" stroke-width="1.3" stroke-linejoin="round"/>
  <circle cx="17.5" cy="13.5" r="2.8" fill="#FF6B4A"/>
  <ellipse cx="18.7" cy="12.3" rx="1" ry="1.3" fill="#16191A"/>
  <path d="M19.3 11.2 24 4.2" stroke="#16191A" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="25" cy="3" r="2.3" fill="none" stroke="#16191A" stroke-width="1.4"/>
</svg>`;

// Best-effort only -- names come from our own sources list (safe), and the
// query is the user's own typed text echoed back into their own page, so
// wrapping matches in a span here carries no injection risk beyond what
// escapeHtml already neutralizes.
function highlightAnswer(answerText, query, names) {
  let html = escapeHtml(answerText);
  [...names].filter(Boolean).sort((a, b) => b.length - a.length).forEach(name => {
    const re = new RegExp(escapeRegex(escapeHtml(name)), 'gi');
    html = html.replace(re, m => `<span class="hl-name">${m}</span>`);
  });
  if (query) {
    const re = new RegExp(escapeRegex(escapeHtml(query)), 'gi');
    html = html.replace(re, m => `<span class="hl-query">${m}</span>`);
  }
  return html;
}

async function loadTagChips() {
  const res = await fetch('/api/tags');
  const data = await res.json();
  data.tags.forEach(t => { tagLabelMap[t.slug] = t.label; });
  const chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = data.tags.map(t => `
    <span class="chip" data-slug="${escapeAttr(t.slug)}" onclick="toggleChip('${t.slug}')">${escapeHtml(t.label)}</span>
  `).join('');
}

function toggleChip(slug) {
  if (selectedTags.has(slug)) selectedTags.delete(slug);
  else selectedTags.add(slug);
  document.querySelectorAll('.chip').forEach(el => {
    el.classList.toggle('active', selectedTags.has(el.dataset.slug));
  });
  // Tag/neighborhood changes only auto-refresh when there's no typed
  // question -- browsing is free (plain SQL), but a real search costs an
  // LLM call, so that only fires on explicit submit.
  if (!document.getElementById('query').value.trim()) {
    runSearch();
  }
}

function renderBarCard(bar, isSearchResult) {
  const mapUrl = `https://www.google.com/maps/place/?q=place_id:${encodeURIComponent(bar.place_id)}`;
  let links = `<a class="icon-link" href="${escapeAttr(mapUrl)}" target="_blank" rel="noopener" title="Open in Google Maps" aria-label="Map">${ICON_MAP}</a>`;
  if (bar.website) links += `<a class="icon-link" href="${escapeAttr(bar.website)}" target="_blank" rel="noopener" title="Visit website" aria-label="Website">${ICON_SITE}</a>`;
  if (bar.instagram_url) links += `<a class="icon-link" href="${escapeAttr(bar.instagram_url)}" target="_blank" rel="noopener" title="Instagram (best-effort match, not guaranteed accurate)" aria-label="Instagram">${ICON_INSTAGRAM}</a>`;

  const metaBits = [bar.neighborhood, bar.price].filter(Boolean).join(' · ');
  const ratingCount = bar.user_rating_count ? ` <span class="count">(${bar.user_rating_count})</span>` : '';
  const tagPills = (bar.tags || []).map(t => `<span>${escapeHtml(tagLabelMap[t] || t.replace(/_/g, ' '))}</span>`).join('');
  const unconfirmedClass = isSearchResult && !bar.confirmed ? ' unconfirmed' : '';
  const badge = isSearchResult && !bar.confirmed ? '<span class="badge">Possible match</span>' : '';
  // Search mode: a query-specific explanation is the most relevant thing
  // to show. Browse mode (or a search result with no explanation): fall
  // back to the bar's precomputed blurb so every card has a description.
  const description = (isSearchResult && bar.explanation) ? bar.explanation : (bar.blurb || '');
  const descriptionHtml = description ? `<div class="explanation">${escapeHtml(description)}</div>` : '';

  return `
    <div class="bar-card${unconfirmedClass}">
      <div class="top-row">
        <div class="name">${escapeHtml(bar.name)}</div>
        <div class="rating">★ ${bar.rating ?? '–'}${ratingCount}</div>
      </div>
      <div class="meta">${escapeHtml(metaBits)}</div>
      <div class="address">${escapeHtml(bar.address)}</div>
      ${badge}
      ${descriptionHtml}
      ${tagPills ? `<div class="card-tags">${tagPills}</div>` : ''}
      <div class="icon-links">${links}</div>
    </div>
  `;
}

function buildRecapText(query, neighborhood, tagSlugs) {
  const parts = [query ? `Looking for "${query}"` : 'Showing bacari'];
  if (neighborhood && neighborhood !== 'All Venice') parts.push(`in ${neighborhood}`);
  if (tagSlugs.length) {
    const labels = tagSlugs.map(s => tagLabelMap[s] || s.replace(/_/g, ' '));
    parts.push(`tagged ${labels.join(' and ')}`);
  }
  return parts.join(' ');
}

async function runSearch() {
  const query = document.getElementById('query').value.trim();
  const neighborhood = document.getElementById('neighborhood').value;
  const statusEl = document.getElementById('status');
  const recapEl = document.getElementById('recap');
  const answerEl = document.getElementById('answer');
  const resultsEl = document.getElementById('results');
  const loaderEl = document.getElementById('loader');

  recapEl.textContent = buildRecapText(query, neighborhood, Array.from(selectedTags));
  statusEl.textContent = '';
  answerEl.style.display = 'none';
  resultsEl.innerHTML = '';
  loaderEl.classList.add('active');

  try {
    const res = await fetch('/api/browse', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query, neighborhood, tags: Array.from(selectedTags), top_n: 9})
    });
    const data = await res.json();
    if (!res.ok) {
      statusEl.textContent = `Something went wrong: ${data.error}`;
      resultsEl.innerHTML = '';
      return;
    }

    if (data.mode === 'search') {
      answerEl.style.display = 'block';
      answerEl.innerHTML = highlightAnswer(data.answer, query, data.sources.map(s => s.name));
      const scopeBits = [];
      if (data.neighborhood && data.neighborhood !== 'All Venice') scopeBits.push(`in ${data.neighborhood}`);
      if (data.geo_filter_applied) scopeBits.push(`within 1 km of ${data.location_detected}`);
      statusEl.textContent = `Analyzed ${data.analyzed} bar${data.analyzed === 1 ? '' : 's'}${scopeBits.length ? ' ' + scopeBits.join(', ') : ''}.`;
      resultsEl.innerHTML = data.sources.length
        ? data.sources.map(b => renderBarCard(b, true)).join('')
        : '';
      if (!data.sources.length) resultsEl.innerHTML = `<div class="empty-state">No bars matched. Try a different question, neighborhood, or fewer tags.</div>`;
    } else {
      statusEl.textContent = data.total > data.bars.length
        ? `Showing top ${data.bars.length} of ${data.total} bars found, sorted by rating.`
        : `${data.total} bar${data.total === 1 ? '' : 's'} found.`;
      resultsEl.innerHTML = data.bars.length
        ? data.bars.map(b => renderBarCard(b, false)).join('')
        : `<div class="empty-state">No bars match these filters yet. Try fewer tags or a different neighborhood.</div>`;
    }
  } catch (networkErr) {
    statusEl.textContent = `Could not reach the server: ${networkErr.message}.`;
  } finally {
    loaderEl.classList.remove('active');
  }
}

document.getElementById('neighborhood').addEventListener('change', runSearch);
document.getElementById('query').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') runSearch();
});
document.getElementById('query').addEventListener('focus', (e) => {
  e.target.placeholder = '';
});

document.getElementById('loaderRow').innerHTML = Array(5).fill(`<span class="loader-bite">${ICON_CROSTINO}</span>`).join('');

// Short, rotating example queries instead of one long static question --
// pauses while the user is typing or has already typed something.
// Short prompts the placeholder "types" out -- mixed food (not just drink)
// and practical asks, since cicchetti are dishes first.
const SEARCH_PLACEHOLDERS = [
  'near Rialto', 'baccalà mantecato', 'cheap wine bar', 'sarde in saor',
  'open late tonight', 'vegan cicchetti', 'local favorite spot',
];
let phIndex = 0;

function typewriterStep() {
  const input = document.getElementById('query');
  if (document.activeElement === input || input.value) {
    setTimeout(typewriterStep, 400);
    return;
  }
  const phrase = SEARCH_PLACEHOLDERS[phIndex];
  let charIndex = 0;

  function typeChar() {
    if (document.activeElement === input || input.value) { setTimeout(typewriterStep, 400); return; }
    charIndex++;
    input.placeholder = phrase.slice(0, charIndex);
    setTimeout(charIndex < phrase.length ? typeChar : eraseChar, charIndex < phrase.length ? 55 : 1300);
  }
  function eraseChar() {
    if (document.activeElement === input || input.value) { setTimeout(typewriterStep, 400); return; }
    charIndex--;
    input.placeholder = phrase.slice(0, charIndex);
    if (charIndex > 0) {
      setTimeout(eraseChar, 28);
    } else {
      phIndex = (phIndex + 1) % SEARCH_PLACEHOLDERS.length;
      setTimeout(typewriterStep, 300);
    }
  }
  typeChar();
}
typewriterStep();

loadTagChips();
runSearch();
</script>
</body>
</html>
